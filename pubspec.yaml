name: offlinetranslate
description: "Google ML Kit ile tamamen internetsiz (offline) çalışan çeviri uygulaması."
publish_to: "none" # Bu proje pub.dev'e yayınlanmayacak.
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Google ML Kit On-Device Translation:
  # Dil modellerini cihaza indirir ve çeviriyi tamamen cihaz üzerinde,
  # internet bağlantısı OLMADAN yapar.
  #
  # NOT: 0.14.0'a YÜKSELTMEYİN — o sürüm Android tarafını Java'dan Kotlin'e
  # tamamen yeniden yazdı (3 gün önce yayınlanmıştı) ve gerçek cihazlarda
  # model indirme "MissingPluginException: nlp#manageLanguageModelModels"
  # hatasıyla başarısız oluyor. 0.13.1 aynı native ML Kit SDK'sını
  # (com.google.mlkit:translate:17.0.3) kanıtlanmış Java implementasyonuyla
  # kullanıyor; Dart API'si birebir aynı.
  google_mlkit_translation: ^0.13.1

  # State Management (Durum Yönetimi):
  # UI (arayüz) ile iş mantığını (business logic) birbirinden ayırmak için.
  provider: ^6.1.5

  # iOS tarzı ikonlar (Flutter standart paketi).
  cupertino_icons: ^1.0.8

  # Modern tipografi (Manrope fontu). Fontlar derleme sırasında pakete
  # gömülür; main.dart'ta allowRuntimeFetching=false ile çalışma zamanında
  # ASLA internet denenmeyeceği garanti edilir (offline uyumluluk).
  google_fonts: ^6.2.1

  # Favori çevirilerin cihazda kalıcı saklanması (tamamen offline).
  shared_preferences: ^2.5.5

  # Çeviri sonucunu diğer uygulamalarla paylaşma (sistem paylaşım menüsü).
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Gerçek cihazlarda model indirirken çıkan NullPointerException'ın native
# stack trace'ini görebilmek için google_mlkit_commons'ın yerel, yamalı
# bir kopyasını kullanıyoruz (bkz. third_party/google_mlkit_commons).
# Orijinal pub.dev sürümü hatayı Flutter'a sadece e.toString() ile
# iletiyordu; yama, Log.getStackTraceString(e)'i PlatformException'ın
# `details` alanına ekliyor. Sadece teşhis amaçlı — pub.dev sürümüyle
# API'si birebir aynı.
dependency_overrides:
  google_mlkit_commons:
    path: third_party/google_mlkit_commons

flutter:
  # Material 3 tasarım standartlarını kullanır.
  uses-material-design: true
