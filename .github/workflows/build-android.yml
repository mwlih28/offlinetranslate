name: Android APK Derle

# Bu iş akışı, PC'ye ihtiyaç duymadan Android APK üretmenizi sağlar.
# Tetiklendiğinde GitHub'ın kendi bulut sunucusunda derleme yapılır;
# sonuç dosyasını "Actions" sekmesinden telefon/tarayıcı ile indirebilirsiniz.
on:
  push:
    branches: [claude/flutter-offline-translator-5nm13x]
  workflow_dispatch: # "Run workflow" butonuyla elle de tetiklenebilir.

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter SDK kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Statik analiz
        run: flutter analyze

      # Play Store'a yüklenecek release imzalama anahtarı bu 4 secret'tan
      # (repo Settings → Secrets and variables → Actions) kurulur. Secret'lar
      # henüz eklenmediyse bu adım hiçbir şey yapmaz ve derleme, eskisi gibi
      # debug anahtarıyla devam eder (Play Store'a yüklenemez ama CI/test
      # amaçlı APK üretimini bozmaz).
      - name: Release imzalama anahtarını hazırla (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Release keystore bulundu — gerçek anahtarla imzalanacak."
          else
            echo "KEYSTORE_BASE64 secret'ı yok — debug anahtarıyla imzalanacak (Play Store'a yüklenemez)."
          fi

      - name: Release APK derle (sideload/test için)
        run: flutter build apk --release

      - name: Release App Bundle derle (Play Store için)
        run: flutter build appbundle --release

      # Derlenen dosyalar, bu workflow çalıştırmasının sayfasında
      # "Artifacts" bölümünde indirilebilir olarak belirir (30 gün saklanır).
      - name: APK'yı indirilebilir dosya olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: offline-ceviri-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: AAB'yi indirilebilir dosya olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: offline-ceviri-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
